<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Hugo — Anime Streaming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        oklch(0.13 0.012 260);
    --bg-2:      oklch(0.11 0.010 260);
    --surface:   oklch(0.18 0.014 260);
    --surface-2: oklch(0.22 0.016 260);
    --fg:        oklch(0.94 0.005 260);
    --muted:     oklch(0.60 0.015 260);
    --faint:     oklch(0.42 0.015 260);
    --border:    oklch(0.26 0.015 260);
    --border-2:  oklch(0.32 0.018 260);
    --accent:    oklch(0.72 0.14 155);
    --accent-2:  oklch(0.72 0.10 180);
    --good:      oklch(0.74 0.14 145);
    --paper:     oklch(0.99 0 0);
    --black:     oklch(0.10 0.01 260);
    --ink:       oklch(0.08 0.008 260);
    --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
    --fg-soft:     color-mix(in oklch, var(--fg) 6%, transparent);
    --fg-softer:   color-mix(in oklch, var(--fg) 3%, transparent);
    --font-display: 'DM Sans', system-ui, -apple-system, sans-serif;
    --font-body:    system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono:    'JetBrains Mono', ui-monospace, monospace;
    --fs-h1: clamp(30px, 3.8vw, 48px);
    --fs-h2: clamp(20px, 2.2vw, 28px);
    --fs-h3: 16px;
    --fs-body: 14px;
    --radius: 8px; --radius-lg: 12px; --radius-sm: 6px;
    --topbar-h: 56px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: var(--fs-body); line-height: 1.5;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 180px;
  }
  h1,h2,h3,h4 { font-family: var(--font-display); margin: 0; letter-spacing: -0.015em; line-height: 1.15; font-weight: 700; }
  p { margin: 0; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }
  ::selection { background: color-mix(in oklch, var(--accent) 30%, transparent); color: var(--fg); }

  .topbar {
    position: sticky; top: 0; z-index: 30; height: var(--topbar-h);
    display: flex; align-items: center; gap: 20px;
    padding: 0 28px;
    background: color-mix(in oklch, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; flex: none; }
  .brand .mark {
    width: 30px; height: 30px; border-radius: 7px; background: var(--accent);
    display: grid; place-items: center; color: var(--paper); font-family: var(--font-display);
    font-weight: 700; font-size: 16px;
  }
  .brand .name { font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: -0.02em; }
  .nav-links { display: flex; gap: 4px; }
  .nav-link {
    padding: 7px 14px; border-radius: var(--radius-sm); font-weight: 600; font-size: 13.5px;
    color: var(--muted); transition: .12s; display: flex; align-items: center; gap: 7px;
  }
  .nav-link:hover { color: var(--fg); background: var(--fg-soft); }
  .nav-link.active { color: var(--fg); background: var(--accent-soft); }
  .nav-link.active svg { color: var(--accent); }
  .nav-link svg { width: 16px; height: 16px; stroke-width: 1.8; }
  .topbar .spacer { flex: 1; }
  .btn-random {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 14px; border-radius: var(--radius-sm);
    background: var(--accent-soft); color: var(--accent);
    border: 1px solid color-mix(in oklch, var(--accent) 20%, transparent);
    font-weight: 600; font-size: 13.5px; transition: .12s; white-space: nowrap;
  }
  .btn-random:hover { background: color-mix(in oklch, var(--accent) 22%, transparent); border-color: color-mix(in oklch, var(--accent) 40%, transparent); }
  .btn-random svg { width: 16px; height: 16px; }

  .view { padding: 24px 28px 72px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    padding: 9px 18px; border-radius: var(--radius-sm); border: 1px solid transparent;
    font-weight: 600; font-size: 13.5px; transition: background .12s, border-color .12s, color .12s; }
  .btn:active { opacity: .85; }
  .btn-primary { background: var(--accent); color: var(--paper); }
  .btn-primary:hover { background: color-mix(in oklch, var(--accent) 85%, var(--black)); }
  .btn-ghost { background: transparent; color: var(--fg); border-color: var(--border); }
  .btn-ghost:hover { border-color: var(--border-2); background: var(--fg-soft); }
  .btn svg { width: 16px; height: 16px; }

  .tag { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted);
    padding: 2px 7px; border: 1px solid var(--border); border-radius: 3px; }

  .poster { position: relative; border-radius: var(--radius); overflow: hidden;
    aspect-ratio: 2 / 3; border: 1px solid var(--border); background: var(--surface); }
  .poster .ttl { position: absolute; left: 10px; right: 10px; bottom: 10px;
    font-family: var(--font-display); font-weight: 700; font-size: 13.5px; line-height: 1.15;
    text-shadow: 0 1px 8px rgba(0,0,0,.8); z-index: 2; }
  .poster::after { content:""; position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(180deg, transparent 45%, rgba(0,0,0,.5)); }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .row-head { display: flex; align-items: baseline; justify-content: space-between; margin: 32px 0 14px; }
  .row-head:first-child { margin-top: 0; }
  .row-head h2 { font-size: var(--fs-h2); }
  .rail { display: grid; grid-auto-flow: column; grid-auto-columns: 152px;
    gap: 12px; overflow-x: auto; padding-bottom: 10px; scroll-snap-type: x proximity; }
  .rail::-webkit-scrollbar { height: 6px; }
  .rail::-webkit-scrollbar-track { background: transparent; }
  .rail::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
  .rail .poster { scroll-snap-align: start; transition: transform .15s ease; cursor: pointer; }
  .rail .poster:hover { transform: translateY(-3px); }

  .result-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px; margin-top: 6px; }
  .result-card { cursor: pointer; }
  .result-card .poster { transition: transform .15s ease; }
  .result-card:hover .poster { transform: translateY(-3px); }
  .result-meta { display: flex; align-items: center; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
  .result-meta .t { font-weight: 600; font-size: 13px; }
  .result-meta .y { color: var(--faint); font-size: 11.5px; }

  .skel { background: var(--surface); border-radius: var(--radius); position: relative; overflow: hidden; }
  .skel::after { content:''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent 0%, var(--surface-2) 50%, transparent 100%);
    background-size: 600px 100%; animation: shimmer 1.6s infinite linear; }
  .skel.poster { aspect-ratio: 2/3; }
  .skel.line { height: 10px; border-radius: 4px; }

  .empty { text-align: center; max-width: 400px; margin: 48px auto; }
  .empty .ic { width: 56px; height: 56px; margin: 0 auto 18px; border-radius: var(--radius);
    display: grid; place-items: center; background: var(--surface); border: 1px solid var(--border); color: var(--muted); }
  .empty .ic svg { width: 24px; height: 24px; }
  .empty h2 { font-size: 20px; margin-bottom: 8px; }
  .empty p { color: var(--muted); margin-bottom: 18px; font-size: 13.5px; line-height: 1.6; }

  .search-view-bar {
    max-width: 520px; margin: 0 auto 20px; position: relative; display: flex; align-items: center;
  }
  .search-view-bar svg { position: absolute; left: 14px; width: 18px; height: 18px; color: var(--faint); pointer-events: none; }
  .search-view-bar input {
    width: 100%; padding: 12px 16px 12px 42px; background: var(--surface); color: var(--fg);
    border: 1px solid var(--border); border-radius: var(--radius);
    font: inherit; font-size: 15px; transition: border-color .12s, background .12s;
  }
  .search-view-bar input::placeholder { color: var(--faint); }
  .search-view-bar input:focus { outline: none; border-color: color-mix(in oklch, var(--accent) 60%, transparent); background: var(--surface-2); }

  .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 24px; }
  .filter-bar .label {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--faint); margin-right: 4px;
  }
  .filter-dd { position: relative; }
  .filter-dd-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: var(--radius-sm);
    background: var(--surface); color: var(--muted); border: 1px solid var(--border);
    font-weight: 600; font-size: 12.5px; transition: .12s; cursor: pointer; white-space: nowrap;
  }
  .filter-dd-btn:hover { color: var(--fg); border-color: var(--border-2); }
  .filter-dd-btn.has-val { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in oklch, var(--accent) 30%, transparent); }
  .filter-dd-btn svg { width: 14px; height: 14px; }
  .filter-dd-menu {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 60;
    min-width: 180px; max-height: 280px; overflow-y: auto;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 4px; display: none; box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  .filter-dd-menu.open { display: block; }
  .filter-dd-menu button {
    display: block; width: 100%; text-align: left;
    padding: 7px 10px; border-radius: 4px; border: 0;
    background: transparent; color: var(--fg); font-size: 12.5px; transition: .1s;
  }
  .filter-dd-menu button:hover { background: var(--fg-soft); }
  .filter-dd-menu button.active { background: var(--accent-soft); color: var(--accent); }
  .filter-clear {
    padding: 7px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-weight: 600; font-size: 12.5px; transition: .12s;
  }
  .filter-clear:hover { color: var(--fg); border-color: var(--border-2); }
  .filter-clear.hidden { display: none; }

  .seg { display: inline-flex; padding: 3px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); gap: 3px; }
  .seg button { padding: 6px 14px; border-radius: 4px; border: 0; background: transparent;
    color: var(--muted); font-weight: 600; font-size: 12.5px; transition: .12s; display: inline-flex; gap: 6px; align-items: center; }
  .seg button .sub-ic, .seg button .dub-ic { width: 7px; height: 7px; border-radius: 50%; }
  .seg button.active { background: var(--accent); color: var(--paper); }
  .seg button.active .sub-ic, .seg button.active .dub-ic { background: var(--paper); }
  .seg button:not(.active) .sub-ic { background: var(--accent); }
  .seg button:not(.active) .dub-ic { background: var(--accent-2); }

  .detail-layout { display: grid; grid-template-columns: 260px 1fr 260px; gap: 20px; align-items: start; }

  /* Left panel — episodes */
  .ep-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; max-height: 600px; display: flex; flex-direction: column; }
  .ep-panel .ep-header { font-size: 15px; font-weight: 700; margin-bottom: 10px; }
  .ep-panel .ep-search {
    width: 100%; padding: 8px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--bg); color: var(--fg); font: inherit; font-size: 13px; margin-bottom: 10px;
  }
  .ep-panel .ep-search::placeholder { color: var(--faint); }
  .ep-panel .ep-search:focus { outline: none; border-color: color-mix(in oklch, var(--accent) 50%, transparent); }
  .ep-list-scroll { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .ep-list-scroll::-webkit-scrollbar { width: 4px; }
  .ep-list-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
  .ep-btn {
    padding: 8px 12px; border-radius: var(--radius-sm); border: 1px solid transparent;
    background: transparent; color: var(--muted); font-weight: 600; font-size: 12.5px;
    text-align: left; transition: .12s; cursor: pointer; display: flex; gap: 8px; align-items: center;
  }
  .ep-btn:hover { background: var(--fg-soft); color: var(--fg); }
  .ep-btn.active { background: var(--accent); color: var(--paper); }
  .ep-btn .ep-num { font-family: var(--font-mono); min-width: 24px; }
  .ep-btn .ep-name { opacity: .7; font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ep-panel .lang-row { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); display: flex; gap: 6px; }

  /* Center — player + info */
  .player-center { display: flex; flex-direction: column; gap: 20px; }
  .player-center .player { border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border); background: var(--ink); }
  .player-center .player iframe { width: 100%; aspect-ratio: 16/9; border: 0; display: block; }
  .player-center .player-status { margin-top: 8px; color: var(--muted); font-size: 12.5px; }
  .info-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
  .info-section .info-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
  .info-section .info-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  .info-section .rating { display: inline-flex; align-items: center; gap: 5px; background: var(--accent-soft);
    color: var(--accent); padding: 4px 10px; border-radius: var(--radius-sm); font-weight: 700; font-size: 13px; }
  .info-section .rating svg { width: 14px; height: 14px; }
  .info-section .syn { color: var(--muted); font-size: 13.5px; line-height: 1.65; max-width: 60ch; margin-top: 10px; }
  .info-section .genre-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .info-section .kv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; margin-top: 14px; }
  .info-section .kv { display: flex; flex-direction: column; gap: 2px; }
  .info-section .kv .k { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); }
  .info-section .kv .v { font-weight: 600; font-size: 13px; }

  /* Right panel — related */
  .related-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; }
  .related-panel .rp-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
  .related-list { display: flex; flex-direction: column; gap: 10px; }
  .related-card { display: flex; gap: 10px; cursor: pointer; padding: 6px; border-radius: var(--radius-sm); transition: .12s; }
  .related-card:hover { background: var(--fg-soft); }
  .related-card img { width: 48px; height: 66px; border-radius: 4px; object-fit: cover; flex: none; }
  .related-card .rc-info { flex: 1; min-width: 0; }
  .related-card .rc-title { font-weight: 600; font-size: 12.5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .related-card .rc-meta { font-size: 11px; color: var(--faint); margin-top: 3px; }

  /* ─── hero banner ─────────────────────────────────────────────────── */
  .hero { position: relative; border-radius: var(--radius-lg); overflow: hidden;
    min-height: 440px; border: 1px solid var(--border); margin-bottom: 24px; }
  .hero .art { position: absolute; inset: 0; }
  .hero::after { content:""; position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(6,6,10,.95) 35%, rgba(6,6,10,.6) 60%, rgba(6,6,10,.1) 80%, transparent 100%),
                linear-gradient(0deg, rgba(6,6,10,.9) 0%, transparent 40%); }
  .hero .hero-bg { position: absolute; right: 0; top: 0; bottom: 0; width: 60%;
    background: url('backround.png') right center/auto 100% no-repeat; z-index: 1;
    mask-image: linear-gradient(to left, black 60%, transparent 100%);
    -webkit-mask-image: linear-gradient(to left, black 60%, transparent 100%); }
  .hero .body { position: relative; z-index: 2; padding: 40px; max-width: 580px; }
  .hero .kicker { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
  .hero h1 { font-size: var(--fs-h1); margin-bottom: 14px; }
  .hero .meta-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  .hero .syn { color: var(--muted); font-size: 14px; max-width: 50ch; margin-bottom: 20px; line-height: 1.6; }
  .hero .cta { display: flex; gap: 10px; flex-wrap: wrap; }

  /* ─── rickroll overlay ───────────────────────────────────────────── */
  .rickroll-overlay {
    position: fixed; inset: 0; z-index: 10000;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
  }
  .rickroll-overlay iframe { width: 100%; height: 100%; border: 0; position: absolute; inset: 0; z-index: 0; }
  .rickroll-overlay .rr-backdrop {
    position: absolute; inset: 0; z-index: 1;
    background: rgba(0,0,0,.95);
  }
  .rickroll-overlay .rr-text {
    position: relative; z-index: 2;
    font-family: var(--font-display); font-size: 18px; color: var(--paper); font-weight: 700;
  }
  .rickroll-overlay .rr-sub {
    position: relative; z-index: 2;
    font-size: 13px; color: var(--muted);
  }

  /* ─── my list / add to list ───────────────────────────────────────── */
  .add-list-wrap { position: relative; display: inline-block; }
  .add-list-btn { display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--surface); color: var(--muted); font-weight: 600; font-size: 13px; transition: .12s; cursor: pointer; }
  .add-list-btn:hover { color: var(--fg); border-color: var(--border-2); background: var(--fg-soft); }
  .add-list-btn.in-list { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in oklch, var(--accent) 30%, transparent); }
  .add-list-btn svg { width: 16px; height: 16px; }
  .add-list-menu {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 60;
    min-width: 170px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 4px; display: none;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  .add-list-menu.open { display: block; }
  .add-list-menu button {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    padding: 8px 10px; border-radius: 4px; border: 0; background: transparent;
    color: var(--fg); font-size: 12.5px; font-weight: 600; transition: .1s; cursor: pointer;
  }
  .add-list-menu button:hover { background: var(--fg-soft); }
  .add-list-menu button.active { background: var(--accent-soft); color: var(--accent); }
  .add-list-menu button .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .add-list-menu .remove-btn { color: #f44; border-top: 1px solid var(--border); margin-top: 4px; padding-top: 8px; }

  .list-page { padding: 0; }
  .list-tabs { display: flex; gap: 4px; margin-bottom: 20px; flex-wrap: wrap; }
  .list-tab { padding: 7px 14px; border-radius: var(--radius-sm); font-weight: 600; font-size: 13px;
    color: var(--muted); background: transparent; border: 1px solid transparent; transition: .12s; cursor: pointer; }
  .list-tab:hover { color: var(--fg); background: var(--fg-soft); }
  .list-tab.active { color: var(--fg); background: var(--accent-soft); border-color: color-mix(in oklch, var(--accent) 20%, transparent); }
  .list-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
  .list-card { position: relative; cursor: pointer; }
  .list-card .poster { transition: transform .15s ease; }
  .list-card:hover .poster { transform: translateY(-3px); }
  .list-card .remove-x {
    position: absolute; top: 6px; right: 6px; z-index: 3;
    width: 24px; height: 24px; border-radius: 50%; border: 0;
    background: rgba(0,0,0,.7); color: var(--paper); font-size: 14px;
    display: grid; place-items: center; cursor: pointer; opacity: 0; transition: .12s;
  }
  .list-card:hover .remove-x { opacity: 1; }
  .continue-remove {
    position: absolute; top: 6px; right: 6px; z-index: 3;
    width: 26px; height: 26px; border-radius: 50%; border: 0;
    background: rgba(0,0,0,.75); color: var(--paper); font-size: 15px;
    display: grid; place-items: center; cursor: pointer; opacity: 0; transition: .15s;
  }
  .rail .poster:hover .continue-remove { opacity: 1; }
  @media (hover: none) and (pointer: coarse) {
    .continue-remove { opacity: .85; width: 30px; height: 30px; font-size: 17px; }

  .list-card .list-status-tag {

    font-family: var(--font-mono); font-size: 10px; padding: 2px 7px;
    border-radius: 3px; font-weight: 600; text-transform: uppercase;
  }

  /* ─── custom context menu ────────────────────────────────────────── */
  .ctx-menu {
    position: fixed; z-index: 9000; min-width: 200px; padding: 4px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: 0 12px 40px rgba(0,0,0,.6); display: none;
  }
  .ctx-menu.open { display: block; }
  .ctx-menu .ctx-label {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--faint); padding: 6px 10px 4px; user-select: none;
  }
  .ctx-menu .ctx-item {
    display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
    padding: 8px 10px; border-radius: 4px; border: 0; background: transparent;
    color: var(--fg); font-size: 13px; font-weight: 500; transition: .1s; cursor: pointer;
  }
  .ctx-menu .ctx-item:hover { background: var(--fg-soft); }
  .ctx-menu .ctx-item svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
  .ctx-menu .ctx-item.danger { color: #f66; }
  .ctx-menu .ctx-item.danger svg { color: #f66; }
  .ctx-menu .ctx-sep { height: 1px; background: var(--border); margin: 4px 0; }

  @keyframes shimmer { 0% { background-position: -600px 0; } 100% { background-position: 600px 0; } }

  @media (max-width: 1080px) {
    .detail-layout { grid-template-columns: 1fr; }
    .ep-panel { max-height: 400px; }
  }
  @media (max-width: 920px) {
    .topbar { padding: 0 14px; gap: 12px; }
    .brand .name { display: none; }
    .view { padding: 18px 14px 72px; }
    .hero .body { padding: 24px; }
    .hero { min-height: 300px; }
    .hero .hero-bg { width: 45%; }
    .related-panel { display: none; }
  }
  @media (max-width: 560px) {
    .rail { grid-auto-columns: 128px; gap: 10px; }
    .result-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
    .filter-bar { gap: 6px; }
  }
  /* ─── iOS / mobile proportional fixes ────────────────────────────── */
  @supports (padding: env(safe-area-inset-top)) {
    .topbar { padding-top: env(safe-area-inset-top); padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); }
    .view { padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
    .ctx-menu { max-height: calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom)); overflow-y: auto; }
  }
  @media (max-width: 480px) {
    :root { --fs-body: 13px; --fs-h2: clamp(18px, 5vw, 24px); --radius: 6px; --radius-lg: 8px; }
    .topbar { height: 48px; gap: 8px; }

    .brand .mark { width: 26px; height: 26px; font-size: 14px; }
    .nav-link { padding: 6px 10px; font-size: 12px; gap: 5px; }

    .btn-random { padding: 6px 10px; font-size: 12px; }

    .hero { min-height: 140px; border-radius: var(--radius); position: relative; overflow: hidden; }
    .hero .hero-bg { display: block; width: 100%; background-size: cover; background-position: center; }
    .hero::after { background: linear-gradient(0deg, rgba(6,6,10,.4) 0%, transparent 40%) !important; }
    .hero .body { display: none; }

    .row-head h2 { font-size: 16px; }
    .poster .ttl { font-size: 11.5px; }
    .result-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
    .search-view-bar input { padding: 10px 14px 10px 36px; font-size: 14px; }
    .filter-bar { gap: 4px; }

    .ep-panel { padding: 10px; max-height: 320px; border-radius: var(--radius); }

    .info-section { padding: 14px; }
    .info-section .info-title { font-size: 14px; }
    .info-section .syn { font-size: 12.5px; }
    .info-section .kv-grid { grid-template-columns: 1fr; gap: 4px; }
    .list-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
    .list-tab { padding: 5px 10px; font-size: 11.5px; }
    .ctx-menu { min-width: 180px; }
    .ctx-menu .ctx-item { padding: 10px; font-size: 14px; }
    .ctx-menu .ctx-item svg { width: 18px; height: 18px; }
    .detail-layout { gap: 12px; }
    .add-list-btn { padding: 6px 12px; font-size: 12px; }
  }
  @media (min-width: 481px) and (max-width: 768px) {
    .hero { min-height: 280px; }
    .hero .hero-bg { width: 50%; }
    .ep-panel { max-height: 360px; }
    .list-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  }
  @media (hover: none) and (pointer: coarse) {

    .ep-btn { min-height: 44px; }
    .filter-dd-btn { min-height: 44px; }
    .nav-link { min-height: 44px; }

</style>

<body>

<header class="topbar">
  <div class="brand">
    <div class="name">Hugo</div>
  </div>
  <nav class="nav-links">
    <a class="nav-link active" data-view="home" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>Home
    </a>
    <a class="nav-link" data-view="search" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>Search
    </a>
    <a class="nav-link" data-view="mylist" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>My List
    </a>
  </nav>
  <div class="spacer"></div>
  <button class="btn-random" id="randomBtn" title="Surprise me">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg>
    Random
  </button>
</header>

<div class="ctx-menu" id="ctxMenu"></div>
<div id="view" class="view"></div>

<script>

const viewEl = document.getElementById("view");
const RICKROLL_URL = "https://www.youtube.com/embed/h4VJGNNSQnw";

let selectedAnime = null;
let currentEpisode = null;
let currentLanguage = "sub";
let currentView = "home";
let lastQuery = "";

// ─── Rickroll ──────────────────────────────────────────────────────
let rickrollTriggered = false;

function triggerRickroll() {
  if (rickrollTriggered) return;
  rickrollTriggered = true;
  const overlay = document.createElement("div");
  overlay.className = "rickroll-overlay";
  overlay.innerHTML = `
    <iframe src="${RICKROLL_URL}?autoplay=1&mute=0" allow="autoplay; encrypted-media"></iframe>
    <div class="rr-backdrop"></div>
    <div class="rr-text">lets go to the moon</div>
    <div class="rr-sub">click to close</div>`;
  overlay.style.pointerEvents = "none";
  setTimeout(() => { overlay.style.pointerEvents = "auto"; }, 15000);
  overlay.addEventListener("click", () => overlay.remove());
  document.body.appendChild(overlay);
}

function maybeRickroll(callback) {
  if (!rickrollTriggered && Math.random() < 0.01) triggerRickroll();
  if (callback) callback();
}

// ─── Filter state ──────────────────────────────────────────────────
let FILTERS = { genre: [], format: null, status: null };
let searchState = { query: "", page: 1, results: [], loading: false };

const GENRE_OPTIONS = [
  "Action","Adventure","Comedy","Drama","Ecchi","Fantasy","Horror","Mahou Shoujo",
  "Mecha","Music","Mystery","Psychological","Romance","Sci-Fi","Slice of Life",
  "Sports","Supernatural","Thriller"
];
const FORMAT_OPTIONS = [
  { label: "TV", value: "TV" }, { label: "Movie", value: "MOVIE" },
  { label: "OVA", value: "OVA" }, { label: "ONA", value: "ONA" },
  { label: "Special", value: "SPECIAL" }, { label: "TV Short", value: "TV_SHORT" },
  { label: "Music", value: "MUSIC" }
];
const STATUS_OPTIONS = [
  { label: "Airing", value: "RELEASING" }, { label: "Finished", value: "FINISHED" },
  { label: "Not Yet Aired", value: "NOT_YET_RELEASED" }, { label: "Cancelled", value: "CANCELLED" },
  { label: "Hiatus", value: "HIATUS" }
];

// ─── localStorage ──────────────────────────────────────────────────
function getContinueWatching() {
  try { return JSON.parse(localStorage.getItem("hugo_continue") || "[]"); } catch { return []; }
}
function saveContinueWatching(list) {
  localStorage.setItem("hugo_continue", JSON.stringify(list.slice(0, 20)));
}
function addContinueWatching(a) {
  let list = getContinueWatching();
  list = list.filter(x => x.id !== a.id);
  list.unshift({ id: a.id, title: a.title, coverImage: a.coverImage, episodes: a.episodes, anilistId: a.anilistId });
  saveContinueWatching(list);
}
function clearContinueWatching() {
  localStorage.removeItem("hugo_continue");
}
function removeContinueWatching(id) {
  const numId = Number(id);
  const list = getContinueWatching().filter(x => (x.id || x.anilistId) !== numId && String(x.id || x.anilistId) !== String(id));
  saveContinueWatching(list);
}

// ─── My List ──────────────────────────────────────────────────────
const LIST_STATUSES = ["Watching", "Completed", "Plan to Watch", "On Hold", "Dropped"];
function getMyList() {
  try { return JSON.parse(localStorage.getItem("hugo_mylist") || "[]"); } catch { return []; }
}
function saveMyList(list) {
  localStorage.setItem("hugo_mylist", JSON.stringify(list));
}
function getListItem(anilistId) {
  return getMyList().find(x => x.anilistId === anilistId) || null;
}
function addToList(anilistId, title, poster, episodes, status) {
  let list = getMyList();
  list = list.filter(x => x.anilistId !== anilistId);
  list.unshift({ anilistId, title, poster, episodes, status, addedAt: Date.now() });
  saveMyList(list);
}
function removeFromList(anilistId) {
  const list = getMyList().filter(x => x.anilistId !== anilistId);
  saveMyList(list);
}

function escapeHtml(t) { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }

function setNav(view) {
  currentView = view;
  document.querySelectorAll(".nav-link").forEach(el => {
    el.classList.toggle("active", el.dataset.view === view);
  });
}

// ─── AniList / Anikoto ─────────────────────────────────────────────
async function anilistGql(query, variables) {
  const r = await fetch("https://graphql.anilist.co", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json" },
    body: JSON.stringify({ query, variables })
  });
  if (!r.ok) throw new Error(`AniList HTTP ${r.status}`);
  return (await r.json()).data;
}

async function fetchAnikoto(path) {
  const r = await fetch(`https://anikotoapi.site${path}`);
  if (!r.ok) throw new Error(`Anikoto HTTP ${r.status}`);
  return r.json();
}

// ─── Filter bar ────────────────────────────────────────────────────
function buildFilterBar() {
  const hasActive = FILTERS.genre.length || FILTERS.format || FILTERS.status;
  const genreLabel = FILTERS.genre.length ? `${FILTERS.genre.length} genre${FILTERS.genre.length>1?'s':''}` : "Genre";
  const formatLabel = FILTERS.format ? FORMAT_OPTIONS.find(f=>f.value===FILTERS.format)?.label || FILTERS.format : "Format";
  const statusLabel = FILTERS.status ? STATUS_OPTIONS.find(s=>s.value===FILTERS.status)?.label || FILTERS.status : "Status";
  return `
    <div class="filter-bar">
      <span class="label">Filter</span>
      <div class="filter-dd" data-filter="genre">
        <button class="filter-dd-btn ${FILTERS.genre.length?'has-val':''}">${escapeHtml(genreLabel)} <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="filter-dd-menu">
          ${GENRE_OPTIONS.map(g => `<button class="${FILTERS.genre.includes(g)?'active':''}" data-val="${g}">${g}</button>`).join('')}
        </div>
      </div>
      <div class="filter-dd" data-filter="format">
        <button class="filter-dd-btn ${FILTERS.format?'has-val':''}">${escapeHtml(formatLabel)} <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="filter-dd-menu">
          <button class="${!FILTERS.format?'active':''}" data-val="">All Formats</button>
          ${FORMAT_OPTIONS.map(f => `<button class="${FILTERS.format===f.value?'active':''}" data-val="${f.value}">${f.label}</button>`).join('')}
        </div>
      </div>
      <div class="filter-dd" data-filter="status">
        <button class="filter-dd-btn ${FILTERS.status?'has-val':''}">${escapeHtml(statusLabel)} <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="filter-dd-menu">
          <button class="${!FILTERS.status?'active':''}" data-val="">All Statuses</button>
          ${STATUS_OPTIONS.map(s => `<button class="${FILTERS.status===s.value?'active':''}" data-val="${s.value}">${s.label}</button>`).join('')}
        </div>
      </div>
      <button class="filter-clear ${hasActive?'':'hidden'}" id="filterClear">Clear filters</button>
    </div>`;
}

function bindFilterEvents(onChange) {
  document.querySelectorAll(".filter-dd-btn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const menu = btn.nextElementSibling;
      const wasOpen = menu.classList.contains("open");
      document.querySelectorAll(".filter-dd-menu").forEach(m => m.classList.remove("open"));
      if (!wasOpen) menu.classList.add("open");
    });
  });
  document.querySelectorAll(".filter-dd-menu button").forEach(btn => {
    btn.addEventListener("click", (e) => {
      const dd = btn.closest(".filter-dd");
      const filter = dd.dataset.filter;
      if (filter === "genre") {
        e.stopPropagation();
        const val = btn.dataset.val;
        if (val) {
          const idx = FILTERS.genre.indexOf(val);
          if (idx >= 0) FILTERS.genre.splice(idx, 1);
          else FILTERS.genre.push(val);
        } else {
          FILTERS.genre = [];
        }
        onChange();
      } else {
        FILTERS[filter] = btn.dataset.val || null;
        document.querySelectorAll(".filter-dd-menu").forEach(m => m.classList.remove("open"));
        onChange();
      }
    });
  });
  document.addEventListener("click", () => {
    document.querySelectorAll(".filter-dd-menu").forEach(m => m.classList.remove("open"));
  });
  const clearBtn = document.getElementById("filterClear");
  if (clearBtn) {
    clearBtn.addEventListener("click", () => {
      FILTERS.genre = []; FILTERS.format = null; FILTERS.status = null;
      onChange();
    });
  }
}

function buildAnilistSearchGql(search, page) {
  const vars = { search: search || null, page: page || 1 };
  const paramDecls = ["$search:String", "$page:Int"];
  const paramRefs = ["search:$search", "type:ANIME"];
  if (FILTERS.genre.length) { paramDecls.push("$genre:[String]"); paramRefs.push("genre_in:$genre"); vars.genre = FILTERS.genre; }
  if (FILTERS.format) { paramDecls.push("$format:MediaFormat"); paramRefs.push("format:$format"); vars.format = FILTERS.format; }
  if (FILTERS.status) { paramDecls.push("$status:MediaStatus"); paramRefs.push("status:$status"); vars.status = FILTERS.status; }
  const query = `query(${paramDecls.join(",")}){
    Page(page:$page,perPage:50){
      media(${paramRefs.join(",")}){
        id title{romaji english}coverImage{large}episodes format status genres description(asHtml:false)startDate{year}
      }
    }
  }`;
  return { query, vars };
}

// ─── Posters ───────────────────────────────────────────────────────
function buildAnilistPoster(a) {
  const title = a.title.english || a.title.romaji || "Unknown";
  const poster = a.coverImage ? a.coverImage.large : "";
  return `<div class="poster" data-anilist='${JSON.stringify({id:a.id, title, poster, episodes:a.episodes||0}).replace(/'/g,"&#39;")}'>
    ${poster ? `<img src="${poster}" alt="">` : `<div style="width:100%;height:100%;background:linear-gradient(135deg,hsl(260 30% 22%),hsl(260 20% 12%))"></div>`}
    <div class="ttl">${escapeHtml(title)}</div>
  </div>`;
}

function buildAnikotoPoster(a) {
  const title = a.title || "Unknown";
  const poster = a.poster || a.image || "";
  return `<div class="poster" data-anilist='${JSON.stringify({id:a.id, title, poster, episodes:a.episodes||0}).replace(/'/g,"&#39;")}'>
    ${poster ? `<img src="${poster}" alt="">` : `<div style="width:100%;height:100%;background:linear-gradient(135deg,hsl(260 30% 22%),hsl(260 20% 12%))"></div>`}
    <div class="ttl">${escapeHtml(title)}</div>
  </div>`;
}

function homeSkeleton() {
  const sk = Array.from({length:8}).map(()=>`
    <div><div class="skel poster"></div>
    <div class="skel line" style="margin-top:8px;width:65%"></div>
    <div class="skel line" style="margin-top:5px;width:35%"></div></div>`).join('');
  return `<div class="row-head"><h2>Loading...</h2></div><div class="rail">${sk}</div>`;
}

// ─── Home ──────────────────────────────────────────────────────────
async function renderHome() {
  setNav("home");
  viewEl.innerHTML = homeSkeleton();
  maybeRickroll();

  let popularData = [], topRatedData = [], recentData = [];
  try {
    const [gqlResult, anikotoResult] = await Promise.all([
      anilistGql(`{popular:Page(page:1,perPage:12){media(type:ANIME,sort:POPULARITY_DESC){id title{romaji english}coverImage{large}episodes format status genres description(asHtml:false)startDate{year}}}topRated:Page(page:1,perPage:12){media(type:ANIME,sort:SCORE_DESC){id title{romaji english}coverImage{large}episodes format status genres description(asHtml:false)startDate{year}}}}`),
      fetchAnikoto("/recent-anime?page=1&per_page=20").catch(() => [])
    ]);
    popularData = gqlResult.popular.media;
    topRatedData = gqlResult.topRated.media;
    recentData = Array.isArray(anikotoResult) ? anikotoResult : (anikotoResult.data || anikotoResult.recent_anime || []);
  } catch(e) { console.error("Home fetch failed:", e); }

  const continueList = getContinueWatching();

  const continueRow = continueList.length ? `
    <div class="row-head"><h2>Continue Watching</h2><button class="filter-clear" id="clearContinue" style="font-size:11px;padding:4px 10px">Clear All</button></div>
    <div class="rail">${continueList.map(a =>
      `<div class="poster" style="position:relative" data-anilist='${JSON.stringify({id:a.id||a.anilistId, title:a.title, poster:a.coverImage, episodes:a.episodes}).replace(/'/g,"&#39;")}'>
        <button class="continue-remove" data-cw-id="${a.id||a.anilistId}">&times;</button>
        ${a.coverImage ? `<img src="${a.coverImage}" alt="">` : ''}
        <div class="ttl">${escapeHtml(a.title)}</div>
      </div>`
    ).join('')}</div>` : '';

  const popularRow = popularData.length ? `
    <div class="row-head"><h2>Popular</h2></div>
    <div class="rail">${popularData.map(a => buildAnilistPoster(a)).join('')}</div>` : '';

  const topRatedRow = topRatedData.length ? `
    <div class="row-head"><h2>Top Rated</h2></div>
    <div class="rail">${topRatedData.map(a => buildAnilistPoster(a)).join('')}</div>` : '';

  const recentRow = recentData.length ? `
    <div class="row-head"><h2>Recently Updated</h2></div>
    <div class="rail">${recentData.map(a => buildAnikotoPoster(a)).join('')}</div>` : '';

  const heroHtml = `<section class="hero">
    <div class="art" style="background:linear-gradient(135deg, hsl(260 30% 18%), hsl(260 20% 10%))"></div>
    <div class="hero-bg"></div>
    <div class="body">
      <h1>All the anime.</h1>
      <p class="syn">Have thousands of anime ready at your fingertips in subbed or dubbed. With progress saved, stream whenever and wherever you want.</p>
      <div class="cta">
        <button class="btn btn-primary" onclick="document.querySelector('[data-view=search]').click()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>Browse Anime
        </button>
      </div>
    </div>
  </section>`;

  viewEl.innerHTML = `${heroHtml}${continueRow}${popularRow}${topRatedRow}${recentRow}`;
}

// ─── Random ────────────────────────────────────────────────────────
async function loadRandomAnime() {
  setNav("home");
  viewEl.innerHTML = homeSkeleton();
  maybeRickroll();
  try {
    const page = Math.floor(Math.random() * 50) + 1;
    const data = await anilistGql(`query($page:Int){Page(page:$page,perPage:50){media(type:ANIME,sort:POPULARITY_DESC){id title{romaji english}coverImage{large}episodes format status genres description(asHtml:false)startDate{year}}}}`, { page });
    const media = data.Page.media;
    if (!media.length) { viewEl.innerHTML = `<div class="empty"><h2>Couldn't find a random anime</h2></div>`; return; }
    const pick = media[Math.floor(Math.random() * media.length)];
    selectAnimeFromAnilist(pick);
  } catch(e) {
    console.error(e);
    viewEl.innerHTML = `<div class="empty"><h2>Failed to load random anime</h2><p>${e.message}</p></div>`;
  }
}

// ─── Search ────────────────────────────────────────────────────────
function renderSearchEmpty(queryVal) {
  setNav("search");
  viewEl.innerHTML = `

function appendResults(animeList) {
  const grid = document.getElementById("resultGrid");
  const loadBtn = document.getElementById("loadMoreBtn");
  if (!grid || !loadBtn) return;
  const cards = animeList.map(a => {
    const title = a.title.english || a.title.romaji || "Unknown";
    const year = a.startDate ? a.startDate.year : "";
    const eps = a.episodes ? `${a.episodes} eps` : "";
    const type = a.format || "";
    return `
      <div class="result-card" data-anime='${JSON.stringify({id:a.id, title, episodes:a.episodes||0, coverImage:a.coverImage.large, format:type, year}).replace(/'/g,"&#39;")}'>
        <div class="poster">
          <img src="${a.coverImage.large}" alt="">
          <div class="ttl">${escapeHtml(title)}</div>
        </div>
        <div class="result-meta"><span class="t">${escapeHtml(title)}</span><span class="y">${year}</span></div>
        <div class="result-meta">${type?`<span class="tag">${type}</span>`:''}${eps?`<span class="tag">${eps}</span>`:''}</div>
      </div>`;
  }).join('');
  grid.insertAdjacentHTML("beforeend", cards);
  const total = searchState.results.length;
  loadBtn.textContent = animeList.length < 50 ? "No more results" : "Load More";
  loadBtn.disabled = animeList.length < 50;
  const countEl = grid.previousElementSibling?.querySelector("span:last-child");
  if (countEl) countEl.textContent = `${total} titles`;
}

async function searchAnime() {
  const input = document.getElementById("searchInput");
  const query = input ? input.value.trim() : "";
  lastQuery = query;
  if (!query && !FILTERS.genre.length && !FILTERS.format && !FILTERS.status) return;
  if (query.toLowerCase().includes("cyberpunk")) triggerRickroll();
  searchState = { query, page: 1, results: [], loading: true };
  renderLoading(query);
  try {
    const { query: gql, vars } = buildAnilistSearchGql(query || null, 1);
    const data = await anilistGql(gql, vars);
    searchState.results = data.Page.media;
    searchState.loading = false;
    renderResults(data.Page.media, query, false);
  } catch (error) {
    console.error(error);
    viewEl.innerHTML = `<div class="empty"><h2>Search failed</h2><p>${error.message}</p></div>`;
  }
}

async function filterBrowse() {
  const input = document.getElementById("searchInput");
  const query = input ? input.value.trim() : "";
  lastQuery = query;
  const hasFilters = FILTERS.genre.length || FILTERS.format || FILTERS.status;
  if (!query && !hasFilters) { renderSearchEmpty(); return; }
  searchState = { query, page: 1, results: [], loading: true };
  renderLoading(query);
  try {
    const { query: gql, vars } = buildAnilistSearchGql(query || null, 1);
    const data = await anilistGql(gql, vars);
    searchState.results = data.Page.media;
    searchState.loading = false;
    renderResults(data.Page.media, query, false);
  } catch(error) {
    console.error(error);
    viewEl.innerHTML = `<div class="empty"><h2>Search failed</h2><p>${error.message}</p></div>`;
  }
}

async function loadMore() {
  if (searchState.loading) return;
  searchState.loading = true;
  const loadBtn = document.getElementById("loadMoreBtn");
  if (loadBtn) { loadBtn.textContent = "Loading..."; loadBtn.disabled = true; }
  try {
    searchState.page++;
    const { query: gql, vars } = buildAnilistSearchGql(searchState.query || null, searchState.page);
    const data = await anilistGql(gql, vars);
    searchState.results = searchState.results.concat(data.Page.media);
    searchState.loading = false;
    appendResults(data.Page.media);
  } catch(error) {
    console.error(error);
    searchState.loading = false;
    if (loadBtn) { loadBtn.textContent = "Failed — try again"; loadBtn.disabled = false; }
  }
}

            ${rating?`<span class="rating"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.27 5.82 22 7 14.14l-5-4.87 6.91-1.01z"/></svg>${rating}%</span>`:''}
            ${year?`<span class="tag">${year}</span>`:''}
            ${type?`<span class="tag">${type}</span>`:''}
            ${status?`<span class="tag">${status}</span>`:''}
            ${eps?`<span class="tag">${eps} episodes</span>`:''}
            <div class="add-list-wrap" style="margin-left:auto">
              <button class="add-list-btn ${listEntry?'in-list':''}" id="addListBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="${listEntry?'M20 6L9 17l-5-5':'M12 5v14M5 12h14'}"/></svg>

  // Bind events
  document.getElementById("epSearch").addEventListener("input", (e) => {
    const q = e.target.value.toLowerCase();
    document.querySelectorAll(".ep-btn").forEach(btn => {

  document.getElementById("langToggle").addEventListener("click", (e) => {

async function selectAnimeFromAnilist(anilistMedia) {
  const title = anilistMedia.title.english || anilistMedia.title.romaji || "Unknown";
  const coverImage = anilistMedia.coverImage ? anilistMedia.coverImage.large : "";
  selectedAnime = {
    id: anilistMedia.id, anilistId: anilistMedia.id,
    title, coverImage: { large: coverImage }, bannerImage: anilistMedia.bannerImage || "",
    episodes: anilistMedia.episodes || 0,
    format: anilistMedia.format || "", status: anilistMedia.status || "",
    genres: anilistMedia.genres || [], description: anilistMedia.description || "",
    startDate: anilistMedia.startDate || null, averageScore: anilistMedia.averageScore || null,
    relations: anilistMedia.relations || null, recommendations: anilistMedia.recommendations || null,
  };
  addContinueWatching({ id: anilistMedia.id, title, coverImage, episodes: anilistMedia.episodes || 0, anilistId: anilistMedia.id });
  currentEpisode = null; currentLanguage = "sub";
  renderDetail(selectedAnime);
  const firstBtn = document.querySelector(".ep-btn");
  if (firstBtn) firstBtn.click();
}

async function loadDetailById(anilistId, title, poster, epCount) {
  viewEl.innerHTML = homeSkeleton();
  let anilistData = null;
  try {
    const gql = `query($id:Int){Media(id:$id,type:ANIME){
      id title{romaji english}coverImage{large}bannerImage
      episodes format status genres averageScore description(asHtml:false)
      startDate{year month day}.endDate{year}
      relations{edges{node{id title{romaji english}coverImage{medium}format type}relationType}}
      recommendations{edges{node{mediaRecommendation{id title{romaji english}coverImage{medium}format episodes}}}}
    }}`;
    const r = await fetch("https://graphql.anilist.co", {
      method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify({query:gql,variables:{id:anilistId}})
    });
    if (r.ok) { const j = await r.json(); anilistData = j.data.Media; }
  } catch(e) {}
  if (anilistData) {
    selectAnimeFromAnilist(anilistData);
  } else {
    selectedAnime = {
      id: anilistId, anilistId, title, coverImage: { large: poster },
      episodes: epCount || 0, format: "", status: "", genres: [], description: "", startDate: null
    };
    addContinueWatching({id:anilistId, title, coverImage:poster, episodes:epCount||0, anilistId});
    currentEpisode = null; currentLanguage = "sub";
    renderDetail(selectedAnime);
    const firstBtn = document.querySelector(".ep-btn");
    if (firstBtn) firstBtn.click();
  }
}

// ─── Context Menu ─────────────────────────────────────────────────
const ctxMenu = document.getElementById("ctxMenu");
let ctxData = {};

function showCtx(x, y, items) {
  let html = "";
  items.forEach(item => {
    if (item.type === "sep") { html += `<div class="ctx-sep"></div>`; return; }
    if (item.type === "label") { html += `<div class="ctx-label">${item.label}</div>`; return; }
    html += `<button class="ctx-item ${item.danger?'danger':''}" data-action="${item.action||''}">
      ${item.icon||''}<span>${item.label}</span></button>`;
  });
  ctxMenu.innerHTML = html;
  ctxMenu.classList.add("open");
  // Position — keep within viewport
  const mw = 220, mh = ctxMenu.offsetHeight || 300;
  const px = (x + mw > window.innerWidth) ? x - mw : x;
  const py = (y + mh > window.innerHeight) ? y - mh : y;
  ctxMenu.style.left = px + "px";
  ctxMenu.style.top = py + "px";
}
function hideCtx() { ctxMenu.classList.remove("open"); ctxData = {}; }

document.addEventListener("click", hideCtx);
document.addEventListener("contextmenu", (e) => {
  e.preventDefault();
  const target = e.target;
  const x = e.clientX, y = e.clientY;

// Context menu actions
ctxMenu.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.dataset.action;
  const data = { ...ctxData };
  hideCtx();

  if (action === "open" && data.id) {
    loadDetailById(data.id, data.title, data.poster || data.coverImage, data.episodes);
  } else if (action === "play" && data.id) {
    selectedAnime = { id: data.id };
    currentLanguage = "sub";
    currentEpisode = 1;
    playEpisode(1);
  } else if (action === "playSub" && data.episode) {
    currentLanguage = "sub";
    document.querySelectorAll("#langToggle button").forEach(b => b.classList.toggle("active", b.dataset.lang==="sub"));
    playEpisode(data.episode);
  } else if (action === "playDub" && data.episode) {
    currentLanguage = "dub";
    document.querySelectorAll("#langToggle button").forEach(b => b.classList.toggle("active", b.dataset.lang==="dub"));
    playEpisode(data.episode);
  } else if (action === "list") {
    if (data.id) {
      const entry = getListItem(data.id);
      if (entry) {
        loadDetailById(data.id, data.title, data.poster || data.coverImage, data.episodes);
      } else {
        addToList(data.id, data.title, data.poster || data.coverImage, data.episodes || 0, "Plan to Watch");
      }
    }
  } else if (action === "copylink" && data.id) {
    navigator.clipboard?.writeText(`https://anilist.co/anime/${data.id}`);
  } else if (action === "copyEpLink" && data.episode && selectedAnime) {
    navigator.clipboard?.writeText(`https://megaplay.buzz/stream/ani/${selectedAnime.id}/${data.episode}/${currentLanguage}`);
  } else if (action === "removeList" && data.id) {
    removeFromList(data.id);
    if (currentView === "mylist") renderMyList();
    else if (currentView === "detail") renderDetail(selectedAnime);
  } else if (action === "goHome") { renderHome(); }
  else if (action === "goSearch") { renderSearchEmpty(); }
  else if (action === "goList") { renderMyList(); }
  else if (action === "goRandom") { loadRandomAnime(); }
});

// ─── Events ────────────────────────────────────────────────────────
viewEl.addEventListener("click", (e) => {
  if (e.target.closest("#clearContinue")) {
    clearContinueWatching();
    renderHome();
    return;
  }
  const cwRemove = e.target.closest(".continue-remove");
  if (cwRemove) {
    e.stopPropagation();
    removeContinueWatching(cwRemove.dataset.cwId);
    renderHome();
    return;
  }
  const poster = e.target.closest(".poster[data-anilist]");
  if (poster) {
    try { const d = JSON.parse(poster.dataset.anilist); loadDetailById(d.id, d.title, d.poster, d.episodes); } catch(err) {}
    return;
  }
  const resultCard = e.target.closest(".result-card");
  if (resultCard) {
    try {
      const data = JSON.parse(resultCard.dataset.anime);
      addContinueWatching({id:data.id, title:data.title, coverImage:data.coverImage, episodes:data.episodes, anilistId:data.id});
      selectAnime(data);
    } catch(err) {}
    return;
  }
});

document.querySelectorAll(".nav-link").forEach(el => {
  el.addEventListener("click", (e) => {
    e.preventDefault();
    maybeRickroll(() => {
      const view = el.dataset.view;
      if (view === "home") renderHome();
      else if (view === "search") renderSearchEmpty(lastQuery);
      else if (view === "mylist") renderMyList();

});

document.getElementById("randomBtn").addEventListener("click", loadRandomAnime);

maybeRickroll(() => renderHome());
